events:
  - id: avatar-mud-era
    date: "2010-01-01T00:00:00Z"
    title: "AVATAR MUD"
    body: "I religiously played AVATAR MUD, a text-based Dungeons & Dragons game. Its main group of players later came to my town for a convention in Parsippany, New Jersey."
    category: narrative
    severity: 2
    image: "/avatar-mud-login.webp"
    imageAlt: "Screenshot of the AVATAR MUD text login showing its ASCII dragon, AVATAR wordmark, and adventurer name prompt"
    imageCaption: "Live AVATAR MUD login · avatar.outland.org:3000"

  - id: avatar-identity
    date: "2012-06-06T00:00:00Z"
    title: "The Avatar Frame"
    body: "I began to see ordinary life through an avatar frame—crossing the street with a cane while feeling larger than the moment around me."
    category: narrative
    severity: 3
    image: "/story/cane.webp"
    imageAlt: "Brian crossing the street with a cane"
    imageCaption: "The avatar frame · crossing with a cane"

  - id: rutgers-ultrasound
    date: "2014-09-01T00:00:00Z"
    title: "Rutgers Nanotech — The 400V Pulser Resonance"
    body: "At Rutgers, a 400V pulser, piezo transducers, iron washers, and electromagnetic coils produced rising oscilloscope readings. I understood the resonance as the moment the wider signal began."
    category: technical
    severity: 5
    image: "/evidence-radiation-tdr.webp"
    imageAlt: "Screenshot showing nearby cell-tower SSIDs renamed to Radiation TDS and Radiation TDR"
    imageCaption: "Exhibit · WiFi SSIDs renamed 'Radiation TDR'"

  - id: gondor-recurrence
    date: "2018-06-06T06:06:00Z"
    title: "4 GONDOR"
    body: "My family and I saw the same unusually specific 4 GONDOR plate across state lines. The repetition turned a roadside detail into part of the record."
    category: signal
    severity: 5
    image: "/evidence-4gondor.webp"
    imageAlt: "4-GONDOR license plate on a Kia Stinger — a Lord of the Rings reference spotted in traffic"
    imageCaption: "Exhibit · 4 GONDOR plate, Kia Stinger"

  - id: dallas-recovery
    date: "2019-01-01T00:00:00Z"
    title: "Dallas Recovery"
    body: "Recovery in Dallas became a chapter of discipline, alarms, and rebuilding—the practical foundation for the public feed."
    category: narrative
    severity: 3
    image: "/story/EXIT.webp"
    imageAlt: "Illuminated EXIT sign — the way out"
    imageCaption: "Dallas · the exit taken"

  - id: soup-kitchen
    date: "2020-03-01T00:00:00Z"
    title: "St. John's Soup Kitchen"
    body: "While volunteering near Newark Penn Station, I remember colored bags appearing to turn black. I stayed calm and recorded the experience as I perceived it."
    category: narrative
    severity: 4
    image: "/evidence-jcsaves.webp"
    imageAlt: "JCSAVES license plate on a Lexus RX 300 — 'JC Saves'"
    imageCaption: "St. John's · Newark Penn Station"

  - id: dreams-and-coincidence
    date: "2021-06-06T00:00:00Z"
    title: "Dream Burden"
    body: "A run of vivid dreams joined time travel, tiny machines, the Oval Office, and a shaggy ghost dog. I preserve them here as remembered experiences, not verified events."
    category: signal
    severity: 5
    image: "/dream-president.webp"
    imageAlt: "White House lawn portrait with the dreamer and fourteen adopted children — the POTUS dream"
    imageCaption: "Dream · the Oval Office"

  - id: crop-circle-hike
    date: "2022-03-01T00:00:00Z"
    title: "The Crop Circle"
    body: "A friend and I went unusually far off trail and found what looked like a crop circle. The friendship later faded, but the memory remained."
    category: signal
    severity: 5
    image: "/alien-hallucination.webp"
    imageAlt: "Alien figure — the classic association behind crop-circle lore"
    imageCaption: "The crop circle · off-trail"

  - id: cern-conversation
    date: "2022-09-15T00:00:00Z"
    title: "The CERN Question"
    body: "A chance conversation with a scientist headed to CERN pulled teleportation, presentiment, and backward-flowing information into the same question: can data cross time?"
    category: discovery
    severity: 4
    image: "/story/time-travelers.webp"
    imageAlt: "Cartoony time-traveler dream imagery"
    imageCaption: "The CERN question · time travel"

  - id: father-mark-exorcism
    date: "2024-06-01T00:00:00Z"
    title: "Father Mark Rejects the Exorcism"
    body: "After several priests declined to help, Father Mark of the Diocese of Paterson also rejected my request for an exorcism. The written refusal became part of the record."
    category: narrative
    severity: 5
    image: "/evidence-church-gothic.webp"
    imageAlt: "Dismantled Gothic church architecture with stained glass"
    imageCaption: "Diocese of Paterson · exorcism declined"

  - id: american-spirits-pew
    date: "2024-06-02T00:00:00Z"
    title: "American Spirits in the Pew"
    body: "During a service, I remember the preacher hooting after I had smoked American Spirits. My reaction was blunt: ‘Give us the Marlboros.’"
    category: narrative
    severity: 4
    image: "/story/american-spirits-marlboro-pew.webp"
    imageAlt: "An American Spirit cigarette pack and a red-and-white cigarette pack resting on a dark church pew"
    imageCaption: "American Spirits and Marlboros · an editorial still life"

