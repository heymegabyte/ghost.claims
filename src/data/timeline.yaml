# Ghost Signal Timeline
# Edit this file to control the story events on ghost.claims
# Categories: signal | discovery | narrative | technical | transmission
# Deploy with `pnpm deploy` after changes

title: "The Ghost Signal"
description: "A chronicle of signals, transmissions, and patterns we refuse to see"

categories:
  signal:
    label: "Signal"
    color: "#FF1744"
  discovery:
    label: "Discovery"
    color: "#7C3AED"
  narrative:
    label: "Narrative"
    color: "#00E5FF"
  technical:
    label: "Technical"
    color: "#7AFFAE"
  transmission:
    label: "Transmission"
    color: "#FF6D00"

events:
  - id: avatar-mud-era
    date: "2010-01-01T00:00:00Z"
    title: "AVATAR MUD"
    body: "I religiously played AVATAR MUD, a text-based Dungeons & Dragons game. Its main group of players later came to my town for a convention in Parsippany, New Jersey."
    category: narrative
    severity: 2
    image: "/avatar-mud-login.webp"
    imageAlt: "Screenshot of the AVATAR MUD text login showing its ASCII dragon, AVATAR wordmark, and adventurer name prompt"
    imageCaption: "Live AVATAR MUD login · avatar.outland.org:3000"

  - id: avatar-identity
    date: "2015-12-01T00:00:00Z"
    title: "The Avatar Frame"
    body: "By December 2015, I was seeing ordinary life through what I called an avatar frame—including this moment crossing the street with a cane."
    category: narrative
    severity: 3
    image: "/story/cane.webp"
    imageAlt: "Brian crossing the street with a cane"
    imageCaption: "The avatar frame · crossing with a cane"

  - id: rutgers-ultrasound
    date: "2014-09-01T00:00:00Z"
    title: "Rutgers Nanotech — The 400V Pulser Resonance"
    body: "While I was working on nanotechnology at Rutgers, I began noticing people following me and moments that felt precisely synchronized. At first I understood those experiences as signs from God; that remains my interpretation, not an independently verified cause."
    category: technical
    severity: 5
    image: "/evidence-radiation-tdr.webp"
    imageAlt: "Screenshot showing nearby cell-tower SSIDs renamed to Radiation TDS and Radiation TDR"
    imageCaption: "Exhibit · WiFi SSIDs renamed 'Radiation TDR'"

  - id: love-tell-your-story
    date: "2014-06-01T00:00:00Z"
    title: "Love and Tell Your Story"
    body: "In June 2014, I photographed a light that I remember as carrying a simple instruction: love, and tell your story. That personal reading later became part of why Ghost Signal accepts first-person accounts."
    category: narrative
    severity: 3
    image: "/light-in-bathroom.webp"
    imageAlt: "A photographed light associated with the remembered phrase love and tell your story"
    imageCaption: "June 2014 · love and tell your story"

  - id: gondor-recurrence
    date: "2018-06-06T06:06:00Z"
    title: "4 GONDOR"
    body: "A family member first told me about a 4 GONDOR plate in Massachusetts. After I joined the church, I saw the same unusually specific plate in New York while traveling to a Church of God service. I preserve the two sightings as a peculiar recurrence, without claiming to know why they happened."
    category: signal
    severity: 5
    image: "/evidence-4gondor.webp"
    imageAlt: "4-GONDOR license plate on a Kia Stinger — a Lord of the Rings reference spotted in traffic"
    imageCaption: "Exhibit · 4 GONDOR plate, Kia Stinger"

  - id: dallas-recovery
    date: "2019-01-01T00:00:00Z"
    title: "Dallas Recovery"
    body: "During and after recovery in Dallas, I remember a run of experiences I understood as miracles: a white van beneath an opening sky, a water jet firing after I mentioned the CIA, and later a white light and a dark orb while I slept beside a pole-less tent in Sweetwater Creek. I also remember paralysis and tingling. These are my recollections and interpretations, not independently verified causes."
    category: narrative
    severity: 3
    image: "/story/EXIT.webp"
    imageAlt: "Illuminated EXIT sign — the way out"
    imageCaption: "Dallas · the exit taken"

  - id: soup-kitchen
    date: "2020-03-01T00:00:00Z"
    title: "St. John's Soup Kitchen"
    body: "While volunteering near Newark Penn Station, I remember colored bags appearing to turn black and what I experienced as a miracle during church. I stayed calm and preserve both as I perceived them."
    category: narrative
    severity: 4
    image: "/evidence-jcsaves.webp"
    imageAlt: "JCSAVES license plate on a Lexus RX 300 — 'JC Saves'"
    imageCaption: "St. John's · Newark Penn Station"

  - id: dreams-and-coincidence
    date: "2021-06-06T00:00:00Z"
    title: "Dream Burden"
    body: "A run of vivid dreams joined time travel, tiny machines, the Oval Office, and a shaggy ghost dog. As an overachiever, I read the presidential dream as a multiverse story about how easily my life might have become much larger. I preserve it as a dream and personal interpretation, not a verified event."
    category: signal
    severity: 5
    image: "/dream-president.webp"
    imageAlt: "White House lawn portrait with the dreamer and fourteen adopted children — the POTUS dream"
    imageCaption: "Dream · the Oval Office"

  - id: crop-circle-hike
    date: "2022-03-01T00:00:00Z"
    title: "The Crop Circle"
    body: "A friend and I went unusually far off trail and found what looked like a crop circle. He seemed as shocked as I was; when I pressed for an explanation, he worried that whoever made it could have damaged the ecological preserve. I answered with my own alien interpretation."
    category: signal
    severity: 5
    image: "/alien-hallucination.webp"
    imageAlt: "Alien figure — the classic association behind crop-circle lore"
    imageCaption: "The crop circle · off-trail"

  - id: cern-conversation
    date: "2022-09-15T00:00:00Z"
    title: "The CERN Question"
    body: "A chance conversation with a scientist headed to CERN pulled teleportation, presentiment, and backward-flowing information into the same question: can data cross time?"
    category: discovery
    severity: 4
    image: "/story/time-travelers.webp"
    imageAlt: "Cartoony time-traveler dream imagery"
    imageCaption: "The CERN question · time travel"

  - id: father-mark-exorcism
    date: "2024-06-01T00:00:00Z"
    title: "Father Mark Rejects the Exorcism"
    body: "After several priests declined to help, Father Mark of the Diocese of Paterson also rejected my request for an exorcism. The written refusal became part of the record."
    category: narrative
    severity: 5
    image: "/evidence-church-gothic.webp"
    imageAlt: "Dismantled Gothic church architecture with stained glass"
    imageCaption: "Diocese of Paterson · exorcism declined"

  - id: american-spirits-pew
    date: "2016-09-01T00:00:00Z"
    title: "American Spirits in the Pew"
    body: "During a service, I remember the preacher hooting after I had smoked American Spirits. My reaction was blunt: ‘Give us the Marlboros.’"
    category: narrative
    severity: 4
    image: "/story/american-spirits-marlboro-pew.webp"
    imageAlt: "An American Spirit cigarette pack and a red-and-white cigarette pack resting on a dark church pew"
    imageCaption: "American Spirits and Marlboros · an editorial still life"

  - id: usb-bridge-online
    date: "2026-04-03T02:47:58Z"
    title: "First EMF Signal"
    body: "The GQ EMF-390 connected through USB and Home Assistant began recording the room’s electromagnetic field."
    category: technical
    severity: 3
    image: "/story/lightning-bolt.webp"
    imageAlt: "Lightning bolt in the distance — raw electromagnetic energy"
    imageCaption: "GQ EMF-390 · first reading"

  - id: six-six-six-pattern
    date: "2026-11-24T18:00:00-05:00"
    title: "666"
    body: "On November 24, 2026, the live chart displayed a 666 timeline annotation beside the newest sensor activity. I tried to remove the older entry, then captured what the site showed. I preserve that screen record as part of the project history; it does not establish a supernatural cause or a 666 mG measurement."
    category: signal
    severity: 5
    image: "/story/emf-chart-2026-11-24.webp"
    imageAlt: "Screen capture of the live EMF chart on November 24, 2026, including the site's 666 timeline annotation"
    imageCaption: "November 24, 2026 · live chart screen record"

  - id: public-api
    date: "2026-04-23T23:00:00Z"
    title: "The Signal Goes Public"
    body: "The sensor feed, AI chat, and (601) 666-6602 hotline opened together as a public record: inspect the Cloudflare-cached data, ask questions, or share an unexplained experience by web or phone."
    category: technical
    severity: 4
    image: "/og-image.jpg"
    imageAlt: "Ghost Signal featured image for the public sensor, chat, and hotline"
    imageCaption: "Public sensor · AI chat · hotline"
